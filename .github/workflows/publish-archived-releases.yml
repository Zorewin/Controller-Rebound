name: Publish archived beta releases

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-archived-releases.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish archived beta releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            local tag="$1"
            local asset="$2"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$asset" --clobber
            else
              gh release create "$tag" "$asset" \
                --title "Controller Rebound $tag" \
                --notes "Archived beta build." \
                --prerelease
            fi
          }

          publish "1.2.0-beta" "releases/ControllerRebound-1.2.0-beta-2026-09-25.zip"
          publish "1.3.0-beta" "releases/ControllerRebound-1.3.0-beta-2026-09-25.zip"
          publish "1.4.0-beta" "releases/ControllerRebound-1.4.0-beta-2026-09-27.zip"
